<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe - SystemesGED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(96,165,250,0.15);
        }
        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37,99,235,0.6);
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="max-w-md w-full glass-card rounded-2xl p-8 border border-blue-500/20">
        <h1 class="text-2xl font-bold text-white text-center mb-6">Nouveau mot de passe</h1>
        <div id="status" class="text-center mb-4"></div>
        <form id="resetForm" class="space-y-4">
            <div>
                <label class="block text-blue-300 text-sm mb-1">Nouveau mot de passe</label>
                <input type="password" id="password" required class="w-full px-4 py-2 rounded-xl bg-slate-900/50 border border-blue-500/30 text-white focus:border-blue-400 outline-none">
            </div>
            <div>
                <label class="block text-blue-300 text-sm mb-1">Confirmer le mot de passe</label>
                <input type="password" id="confirmPassword" required class="w-full px-4 py-2 rounded-xl bg-slate-900/50 border border-blue-500/30 text-white focus:border-blue-400 outline-none">
            </div>
            <button type="submit" class="w-full btn-primary py-3 rounded-xl text-white font-semibold">Réinitialiser</button>
        </form>
        <div id="message" class="mt-4 text-center text-sm"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://whkvtpqesqiailwjgoaq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indoa3Z0cHFlc3FpYWlsd2pnb2FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxOTU1ODIsImV4cCI6MjA4OTc3MTU4Mn0.oIEDNRvSAEsVTarXnIl1cMTLoqS1nsHo8dPnjdW0ng8';
        const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Extraire le token depuis l'URL (hash fragment)
        const hashParams = new URLSearchParams(window.location.hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token');
        const type = hashParams.get('type');

        const statusDiv = document.getElementById('status');
        const form = document.getElementById('resetForm');
        const messageDiv = document.getElementById('message');

        if (!accessToken || type !== 'recovery') {
            statusDiv.innerHTML = '❌ Lien invalide ou expiré. Veuillez demander une nouvelle réinitialisation.';
            statusDiv.classList.add('text-red-400');
            form.style.display = 'none';
        } else {
            statusDiv.innerHTML = '✅ Lien valide. Veuillez choisir un nouveau mot de passe.';
            statusDiv.classList.add('text-green-400');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (password !== confirm) {
                messageDiv.innerHTML = '❌ Les mots de passe ne correspondent pas.';
                messageDiv.classList.add('text-red-400');
                return;
            }

            if (password.length < 6) {
                messageDiv.innerHTML = '❌ Le mot de passe doit faire au moins 6 caractères.';
                messageDiv.classList.add('text-red-400');
                return;
            }

            try {
                // ✅ 1. Activer la session avec le lien email
    		await client.auth.setSession({
     		   access_token: accessToken,
     		   refresh_token: refreshToken
   		 });

   		 // ✅ 2. CHANGER LE MOT DE PASSE (👉 ICI TA LIGNE)
   		 const { error } = await client.auth.updateUser({
     		   password: password
  		  });
            	    if (error) throw error;

                messageDiv.innerHTML = '✅ Merci votre mot de passe a été réinitialisé ! Vous allez être redirigé.';
                messageDiv.classList.add('text-green-400');
                form.style.display = 'none';
                setTimeout(() => {
                    window.location.href = '/';
                }, 3000);
            } catch (err) {
                console.error(err);
                messageDiv.innerHTML = '❌ Erreur lors de la mise à jour : ' + err.message;
                messageDiv.classList.add('text-red-400');
            }
        });
    </script>
</body>
</html>
