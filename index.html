<!-- ═══════════════════════════════════════════════════════
     SystemesGED v5.0 — PATCH HTML
     Insérez ces blocs dans index.html aux bons endroits
     ═══════════════════════════════════════════════════════ -->

<!-- ════════════════════════════════════════════════════════
  1. ONGLETS DOCUMENTS (remplacer le header de view-documents)
     Remplacez la ligne :
     <div id="view-documents" class="view-section space-y-6">
     par :
════════════════════════════════════════════════════════ -->
<div id="view-documents" class="view-section space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-white flex items-center gap-3">
        <i class="fas fa-file-alt text-blue-400"></i>Documents
      </h2>
      <p class="text-sm text-blue-300/80 mt-1">Gérez les documents de votre entreprise</p>
    </div>
    <button onclick="openUploadModal()" class="btn-primary px-4 py-2.5 rounded-xl text-sm text-white flex items-center gap-2">
      <i class="fas fa-cloud-upload-alt"></i> Importer
    </button>
  </div>

  <!-- Onglets Entreprise / Mes docs / Partagés -->
  <div class="flex gap-1 p-1 rounded-xl" style="background:rgba(0,0,0,0.2);border:1px solid rgba(96,165,250,0.1)">
    <button id="docsTab-company" onclick="switchDocsTab('company')"
      class="sidebar-item flex-1 py-2 text-sm font-medium rounded-lg text-center active flex items-center justify-center gap-2">
      <i class="fas fa-building"></i> Entreprise
    </button>
    <button id="docsTab-mine" onclick="switchDocsTab('mine')"
      class="sidebar-item flex-1 py-2 text-sm font-medium rounded-lg text-center flex items-center justify-center gap-2">
      <i class="fas fa-user"></i> Mes documents
    </button>
    <button id="docsTab-shared" onclick="switchDocsTab('shared')"
      class="sidebar-item flex-1 py-2 text-sm font-medium rounded-lg text-center flex items-center justify-center gap-2">
      <i class="fas fa-share-alt"></i> Partagés avec moi
    </button>
  </div>

  <!-- Filtres -->
  <div class="flex flex-wrap gap-3 items-center">
    <select id="filterType" onchange="applyFilters()" class="bg-slate-900/50 border border-blue-500/20 rounded-lg px-3 py-2 text-sm text-gray-300 outline-none">
      <option value="">Tous types</option>
      <option value="pdf">PDF</option>
      <option value="doc">Word</option>
      <option value="xls">Excel</option>
      <option value="img">Images</option>
    </select>
    <select id="filterDate" onchange="applyFilters()" class="bg-slate-900/50 border border-blue-500/20 rounded-lg px-3 py-2 text-sm text-gray-300 outline-none">
      <option value="">Toutes dates</option>
      <option value="today">Aujourd'hui</option>
      <option value="week">Cette semaine</option>
      <option value="month">Ce mois</option>
    </select>
    <button onclick="clearFilters()" class="px-3 py-2 text-xs text-blue-400 border border-blue-500/20 rounded-lg hover:bg-blue-500/10 flex items-center gap-1">
      <i class="fas fa-times"></i> Réinitialiser
    </button>
    <button onclick="toggleViewMode()" class="ml-auto p-2 text-blue-400 border border-blue-500/20 rounded-lg hover:bg-blue-500/10">
      <i id="viewModeIcon" class="fas fa-th-large"></i>
    </button>
    <span id="resultsCount" class="text-sm text-blue-300/50"></span>
  </div>

  <!-- Drop zone + grille -->
  <div id="docDropZone" class="border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition-all"
    style="border-color:rgba(96,165,250,0.3);"
    onclick="document.getElementById('filePickerInput').click()"
    ondragover="handleDragOver(event,'docDropZone')"
    ondragleave="handleDragLeave(event,'docDropZone')"
    ondrop="handleDocDrop(event)">
    <i class="fas fa-cloud-upload-alt text-blue-400 text-2xl mb-2"></i>
    <p class="text-white text-sm font-medium">Glissez vos fichiers ici ou cliquez</p>
    <p class="text-blue-400/50 text-xs">PDF, Word, Excel, Images… Max 100 MB</p>
  </div>
  <input type="file" id="filePickerInput" class="hidden" multiple onchange="handleFilePickerSelect(event)">
  <div class="doc-grid" id="documentGrid"></div>
</div>


<!-- ════════════════════════════════════════════════════════
  2. MODAL COLLABORATEURS (à insérer avant </body>)
════════════════════════════════════════════════════════ -->
<div id="permModal" class="modal-overlay hidden">
  <div class="modal-box" style="max-width:520px">
    <div class="flex items-center justify-between mb-5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 bg-cyan-500/20 rounded-xl flex items-center justify-center text-cyan-400">
          <i class="fas fa-users"></i>
        </div>
        <div>
          <h3 class="text-white font-bold">Collaborateurs</h3>
          <p id="permDocName" class="text-blue-300/60 text-sm truncate max-w-xs"></p>
        </div>
      </div>
      <button onclick="closePermModal()" class="text-blue-400 hover:text-white p-2 rounded-lg">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Liste collaborateurs -->
    <div id="collaboratorsList" class="space-y-2 mb-5 max-h-52 overflow-y-auto">
      <p class="text-blue-300/50 text-sm text-center py-4">Aucun collaborateur</p>
    </div>

    <!-- Ajouter collaborateur -->
    <div class="pt-4 border-t border-blue-500/20">
      <p class="text-sm font-medium text-blue-300 mb-3">Ajouter un collaborateur</p>
      <div class="flex gap-3">
        <div class="flex-1 relative">
          <i class="fas fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-blue-400 text-sm"></i>
          <input type="email" id="collabEmail" placeholder="email@entreprise.com"
            class="w-full pl-9 pr-3 py-2.5 rounded-xl text-white text-sm outline-none"
            style="background:rgba(8,15,40,0.7);border:1px solid rgba(96,165,250,0.2);">
        </div>
        <select id="collabPermission" class="bg-slate-900/50 border border-blue-500/20 rounded-xl px-3 text-sm text-gray-300 outline-none">
          <option value="viewer">Lecture</option>
          <option value="editor">Édition</option>
          <option value="owner">Propriétaire</option>
        </select>
        <button onclick="addCollaborator()" class="btn-primary px-4 py-2.5 rounded-xl text-white text-sm flex items-center gap-2">
          <i class="fas fa-user-plus"></i> Ajouter
        </button>
      </div>
    </div>
  </div>
</div>


<!-- ════════════════════════════════════════════════════════
  3. MODAL WORKFLOW — ajouter champ Assignee
     Dans le workflowModal existant, ajouter après wfPriority :
════════════════════════════════════════════════════════ -->
<div>
  <label class="text-blue-200 text-xs font-medium block mb-1">Assigner à</label>
  <select id="wfAssignee" class="w-full px-3 py-2.5 rounded-xl text-white text-sm outline-none"
    style="background:rgba(8,15,40,0.7);border:1px solid rgba(96,165,250,0.2);">
    <option value="">-- Non assigné --</option>
  </select>
</div>


<!-- ════════════════════════════════════════════════════════
  4. DASHBOARD — Ajouter section "Documents de l'équipe"
     À insérer dans view-dashboard après les stats :
════════════════════════════════════════════════════════ -->
<!-- Docs récents de l'entreprise -->
<div class="glass-card rounded-2xl border border-blue-500/20 p-5">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-white font-bold flex items-center gap-2">
      <i class="fas fa-building text-blue-400"></i> Derniers documents de l'équipe
    </h3>
    <button onclick="switchView('documents')" class="text-xs text-blue-400 hover:text-blue-300">Voir tout →</button>
  </div>
  <div id="teamDocsList" class="space-y-2">
    <p class="text-blue-300/50 text-sm text-center py-4">Chargement...</p>
  </div>
</div>

<!-- Mes workflows assignés -->
<div class="glass-card rounded-2xl border border-orange-500/20 p-5">
  <div class="flex items-center justify-between mb-4">
    <h3 class="text-white font-bold flex items-center gap-2">
      <i class="fas fa-project-diagram text-orange-400"></i> Mes workflows en attente
      <span id="myWorkflowsBadge" class="px-2 py-0.5 bg-orange-500/20 text-orange-300 text-xs rounded-full hidden">0</span>
    </h3>
    <button onclick="switchView('workflows')" class="text-xs text-blue-400 hover:text-blue-300">Voir tout →</button>
  </div>
  <div id="myWorkflowsList" class="space-y-2">
    <p class="text-blue-300/50 text-sm text-center py-4">Aucun workflow assigné</p>
  </div>
</div>


<!-- ════════════════════════════════════════════════════════

<button onclick="switchView('shared');closeMobileSidebar()"

  <i class="fas fa-share-alt w-5 text-center text-blue-400"></i>

</button>
