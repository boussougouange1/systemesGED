<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEMESGED</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-900 text-white">

<div id="loginScreen" class="flex items-center justify-center min-h-screen">

<div class="bg-slate-800 p-8 rounded-xl w-96">

<h1 class="text-2xl font-bold mb-6 text-center">SYSTEMESGED</h1>

<input id="email" placeholder="Email"
class="w-full p-2 mb-3 text-black rounded">

<input id="password" type="password"
placeholder="Password"
class="w-full p-2 mb-4 text-black rounded">

<button onclick="login()"
class="w-full bg-blue-600 p-2 rounded">
Login
</button>

<button onclick="register()"
class="w-full mt-2 bg-green-600 p-2 rounded">
Register
</button>

</div>

</div>


<div id="app" class="hidden p-6">

<div class="flex justify-between mb-6">

<h2 class="text-2xl font-bold">Documents</h2>

<div>

<button onclick="logout()" class="bg-red-600 px-3 py-1 rounded">
Logout
</button>

</div>

</div>


<div class="mb-4">

<input id="search"
placeholder="Search"
class="p-2 text-black rounded"
onkeyup="searchDocuments(this.value)">

<input type="file" id="fileInput">

<button onclick="uploadDocument()"
class="bg-blue-600 px-3 py-2 rounded">
Upload
</button>

</div>


<div id="documentsList"
class="grid grid-cols-3 gap-4">

</div>

</div>


<script>


const supabaseUrl="https://spgtflhprppeoidjguhs.supabase.co"

const supabaseKey="YOUR_SUPABASE_ANON_KEY"

const supabaseClient=supabase.createClient(
supabaseUrl,
supabaseKey
)

let currentUser=null
let documents=[]


async function login(){

const email=document.getElementById("email").value
const password=document.getElementById("password").value

const {data,error}=await supabaseClient.auth.signInWithPassword({
email,
password
})

if(error){
alert(error.message)
return
}

currentUser=data.user

initApp()

}


async function register(){

const email=document.getElementById("email").value
const password=document.getElementById("password").value

const {data,error}=await supabaseClient.auth.signUp({
email,
password
})

if(error){
alert(error.message)
return
}

alert("Account created")

}


async function logout(){

await supabaseClient.auth.signOut()

location.reload()

}



async function initApp(){

document.getElementById("loginScreen").classList.add("hidden")

document.getElementById("app").classList.remove("hidden")

loadDocuments()

}



async function loadDocuments(){

const {data,error}=await supabaseClient
.from("documents")
.select("*")
.order("created_at",{ascending:false})

if(error){
console.log(error)
return
}

documents=data

renderDocuments()

}



function renderDocuments(){

const container=document.getElementById("documentsList")

container.innerHTML=""

documents.forEach(doc=>{

const div=document.createElement("div")

div.className="bg-slate-800 p-4 rounded"

div.innerHTML=`

<h3 class="font-bold">${doc.name}</h3>

<div class="text-xs mb-2">
${new Date(doc.created_at).toLocaleDateString()}
</div>

<div class="flex gap-2">

<button onclick="openDocument('${doc.file_url}')"
class="bg-green-600 px-2 py-1 rounded">
Open
</button>

<button onclick="shareDocument('${doc.id}')"
class="bg-blue-600 px-2 py-1 rounded">
Share
</button>

<button onclick="deleteDocument('${doc.id}')"
class="bg-red-600 px-2 py-1 rounded">
Delete
</button>

</div>
`

container.appendChild(div)

})

}



function openDocument(url){

window.open(url,"_blank")

}



async function uploadDocument(){

const file=document.getElementById("fileInput").files[0]

if(!file){
alert("Select file")
return
}

const fileName=Date.now()+"_"+file.name


const {error}=await supabaseClient.storage
.from("documents")
.upload(fileName,file)

if(error){
alert(error.message)
return
}


const {data:urlData}=supabaseClient.storage
.from("documents")
.getPublicUrl(fileName)


const {data:doc}=await supabaseClient
.from("documents")
.insert([{
name:file.name,
file_url:urlData.publicUrl,
owner_id:currentUser.id
}])
.select()
.single()



await supabaseClient
.from("document_versions")
.insert([{
document_id:doc.id,
version_number:1,
file_url:urlData.publicUrl
}])


await supabaseClient
.from("activity_logs")
.insert([{
user_id:currentUser.id,
document_id:doc.id,
action:"upload"
}])


loadDocuments()

}



async function deleteDocument(id){

if(!confirm("Delete document?")) return

await supabaseClient
.from("documents")
.delete()
.eq("id",id)

loadDocuments()

}



async function shareDocument(documentId){

const email=prompt("User email")

if(!email) return

const {data:user}=await supabaseClient
.from("users_profiles")
.select("id,email")
.eq("email",email)
.single()

if(!user){
alert("User not found")
return
}

await supabaseClient
.from("document_permissions")
.insert([{
document_id:documentId,
user_id:user.id,
permission:"read"
}])

alert("Document shared")

}



function searchDocuments(q){

const results=documents.filter(d=>
d.name.toLowerCase().includes(q.toLowerCase())
)

const container=document.getElementById("documentsList")

container.innerHTML=""

results.forEach(doc=>{

const div=document.createElement("div")

div.className="bg-slate-800 p-4 rounded"

div.innerHTML=doc.name

container.appendChild(div)

})

}



async function checkSession(){

const {data:{session}}=await supabaseClient.auth.getSession()

if(session){

currentUser=session.user

initApp()

}

}


checkSession()


</script>

</body>
</html>
